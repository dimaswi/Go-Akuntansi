services:
  postgres:
    image: postgres:16-alpine
    container_name: go_akuntansi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: akuntansi_db
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d akuntansi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
